<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail příspěvku - Tvůrčí psaní</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2.7">
</head>
<body>
  <header id="site-header"></header>

  <main class="post-page">
    <div class="container">
      <nav class="reading-nav" aria-label="Navigace textu"><a href="all-posts.html">← Zpět na texty</a></nav>
      <article class="post-content">
        <header class="post-header">
          <div class="post-meta">
            <span class="post-date" id="postDate">1. března 2025</span>
            <span class="post-category" id="postCategory">Kategorie</span>
          </div>
          <h1 class="post-title" id="postTitle">Název příspěvku</h1>
          <div class="post-author">
            <img src="image5.webp" alt="Jméno autora" id="authorImage" loading="lazy">
            <div class="post-author__identity">
              <a href="#" class="author-link" id="authorLink"><span class="author-name" id="authorName">Jméno autora</span></a>
              <div class="author-word-box">
                <button type="button" class="author-word-toggle" aria-haspopup="dialog">Slovo autora</button>
                <p id="authorWord" hidden></p>
              </div>
            </div>
          </div>
        </header>

        <div class="post-body" id="postContent">
          <p>Lorem ipsum dolor sit amet…</p>
          <p>Etiam sit amet est vel nisl…</p>
        </div>



        <footer class="post-footer">
          <div class="post-tags"></div>
        </footer>
      </article>

      <section class="related-posts">
        <h2 class="section-title">Co číst dál</h2>
        <div class="text-grid"></div>
        <div class="view-all"><a class="view-all-button" href="all-posts.html">Prohlédnout všechny texty</a></div>
      </section>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="data.js?v=6" defer></script>
  <script src="utils.js?v=3" defer></script>
  <script src="interactions.js?v=1" defer></script>
  <script src="catalog.js?v=13" defer></script>
  <script src="post.js?v=9" defer></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => Utils.bootstrap({ active: 'posts' }));
  </script>
</body>
</html>
