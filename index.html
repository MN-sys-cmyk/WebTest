<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tvůrčí psaní - Platforma pro autory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20261008-balanced">

</head>
<body>
  
  <section class="hero">
    <div class="hero-image"></div>
    <div class="container">
      <div class="hero-content">
        <h1 class="hero-title">Objevujte svět současné české literatury</h1>
        <p class="hero-subtitle">Platforma propojující autory, čtenáře a literární nadšence</p>

        <div class="hero-actions">
          <a href="#nejnovejsi-texty" class="hero-action hero-action--primary">Začít číst</a>
          <a href="all-authors.html" class="hero-action hero-action--secondary">Poznat autory</a>
        </div>
      </div>
    </div>
  </section>

  <section class="latest-posts" id="nejnovejsi-texty">
    <div class="container">
      <div class="section-header">
        <h2 class="section-title">Nejnovější texty</h2>
        <p class="section-subtitle">Aktuální tvorba našich autorů</p>
      </div>

      <div class="texts-carousel" role="region" aria-label="Nejnovější texty" aria-roledescription="karusel">
        <button type="button" class="carousel-arrow prev" aria-label="Předchozí texty" aria-controls="latest-texts-grid">❮</button>
        <div class="carousel-container">
          <div class="carousel-track" id="latest-texts-grid"></div>
        </div>
        <button type="button" class="carousel-arrow next" aria-label="Další texty" aria-controls="latest-texts-grid">❯</button>
        <div class="carousel-indicator" id="texts-indicator"></div>
      </div>

      <div class="view-all latest-posts-actions">
        <a href="all-posts.html" class="view-all-button">Zobrazit všechny texty</a>
        <a href="all-authors.html" class="view-all-button">Zobrazit všechny autory</a>
      </div>
    </div>
  </section>




  <script src="data.js?v=6" defer></script>
  <script src="utils.js?v=20261008" defer></script>
  <script src="interactions.js?v=1" defer></script>
  <script src="catalog.js?v=20261008" defer></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => Utils.bootstrap({ active: 'home' }));
  </script>
</body>
</html>
